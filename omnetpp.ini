[General]
network = dsdv_lab.DsdvLabNetwork
sim-time-limit = 60s

# ------------------------------------------------------------
# 1. Network size and IPv4 configuration
# ------------------------------------------------------------
*.numNodes = 6
*.configurator.addStaticRoutes = false
*.configurator.addDefaultRoutes = false

# ------------------------------------------------------------
# 2. Fixed node positions: simple linear multi-hop topology
# ------------------------------------------------------------
*.node[*].mobility.typename = "StationaryMobility"
*.node[*].mobility.initialY = 220m
*.node[*].mobility.initialZ = 0m

*.node[0].mobility.initialX = 100m
*.node[1].mobility.initialX = 220m
*.node[2].mobility.initialX = 340m
*.node[3].mobility.initialX = 460m
*.node[4].mobility.initialX = 580m
*.node[5].mobility.initialX = 700m

# ------------------------------------------------------------
# 3. IEEE 802.11 ad-hoc radio settings
# ------------------------------------------------------------
**.wlan[*].bitrate = 2Mbps
**.wlan[*].mac.dcf.channelAccess.cwMin = 7
**.wlan[*].radio.transmitter.power = 2mW

# ------------------------------------------------------------
# 4. DSDV routing
# ------------------------------------------------------------
*.node[*].dsdv.helloInterval = 2s
*.node[*].dsdv.routeLifetime = 6s

# ------------------------------------------------------------
# 5. Traffic: node[0] pings node[5]
# Start after DSDV has had time to exchange routing information.
# ------------------------------------------------------------
*.node[0].numApps = 1
*.node[0].app[0].typename = "PingApp"
*.node[0].app[0].destAddr = "node[5](ipv4)"
*.node[0].app[0].startTime = 10s
*.node[0].app[0].stopTime = 55s
*.node[0].app[0].sendInterval = 1s
*.node[0].app[0].packetSize = 64B
*.node[0].app[0].printPing = true

# ------------------------------------------------------------
# 6. Animation and visualization
# ------------------------------------------------------------
*.visualizer.mediumVisualizer.displaySignals = true
*.visualizer.mediumVisualizer.displaySignalDepartures = true
*.visualizer.mediumVisualizer.displaySignalArrivals = true

*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "ping* or Ping* or ICMP*"
*.visualizer.networkRouteVisualizer.fadeOutTime = 2s

*.visualizer.routingTableVisualizer.displayRoutingTables = true
*.visualizer.routingTableVisualizer.nodeFilter = "node[*]"
*.visualizer.routingTableVisualizer.destinationFilter = "10.0.0.*"
*.visualizer.routingTableVisualizer.labelFormat = "%d/%m -> %g"

# ------------------------------------------------------------
# 7. Result recording
# .sca/.vec: performance results
# .rt      : routing-table changes
# ------------------------------------------------------------
**.scalar-recording = true
**.vector-recording = true
*.routingTableRecorder.enabled = true
*.routingTableRecorder.logfile = "${resultdir}/${configname}-#${runnumber}.rt"

output-scalar-file = "${resultdir}/${configname}-#${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-#${runnumber}.vec"

# Keep the recorded data focused on the teaching experiment.
**.app[0].rtt.result-recording-modes = histogram,vector
**.app[0].pingTxSeq.result-recording-modes = count,vector
**.app[0].pingRxSeq.result-recording-modes = count,vector
**.app[0].numLost.result-recording-modes = last,vector
